<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#1a365d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apertura Aulas">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-192.svg">
  <link rel="icon" href="/static/icon-192.svg" type="image/svg+xml">
  <title>Iniciar sesión — Apertura Aulas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1a365d, #2b6cb0); min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .form-control, .btn { min-height: 44px; }
    @media (display-mode: standalone) { body { user-select: none; } }
    .login-card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-width: 400px; width: 100%; }
    .login-header { background: #1a365d; color: white; border-radius: 16px 16px 0 0; padding: 1.5rem; text-align: center; }
  </style>

  <style>
    .form-control, .form-select {
      border: 2px solid #4a7ab8 !important;
      border-radius: 8px !important;
      min-height: 42px;
      background: #fff !important;
    }
    .form-control:focus, .form-select:focus {
      border-color: #2b6cb0 !important;
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.28) !important;
      background: #f0f7ff !important;
    }
    .form-label { font-weight: 600; color: #1a365d; }
  </style>
</head>
<body>
  <div class="card login-card mx-3">
    <div class="login-header">
      <i class="bi bi-building-check fs-1"></i>
      <h4 class="mt-2 mb-0">Registro de Apertura de Aulas</h4>
    </div>
    <div class="card-body p-4">
      {% if error %}<div class="alert alert-danger py-2">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="password" id="passLogin" class="form-control" required>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePass()">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
      </form>
      <hr>
      <p class="text-center mb-0"><a href="/registro">¿No tienes cuenta? Regístrate</a></p>
    </div>
  </div>
  <script>
    function togglePass() {
      const el = document.getElementById('passLogin');
      const icon = document.getElementById('eyeIcon');
      if (el.type === 'password') { el.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { el.type = 'password'; icon.className = 'bi bi-eye'; }
    }
  </script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
